name: Lesson or translation / 课程与翻译
description: Improve an explanation, source mapping, learning path, or translation / 改进讲解、来源、路径或翻译
title: '[Learning] '
body:
  - type: input
    id: lesson
    attributes:
      label: Lesson or page / 课程或页面
      description: Notebook number, route, or source link / 编号、网页路径或来源链接
      placeholder: '35 · Search judgments, English, #search/path'
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Where did you get stuck? / 卡在哪里？
      description: Quote the short confusing sentence or describe the missing step / 简述不清楚的句子或缺少的步骤
    validations:
      required: true
  - type: textarea
    id: correction
    attributes:
      label: Proposed explanation or evidence / 建议解释或证据
      description: A correction, counterexample, or primary source is helpful / 可提供修正、反例或原始来源
  - type: dropdown
    id: evidence
    attributes:
      label: Type of contribution / 贡献类型
      options:
        - Explanation / 讲解
        - Translation / 翻译
        - Source mapping / 来源对应
        - New experiment / 新实验
        - Learning path / 学习路径
