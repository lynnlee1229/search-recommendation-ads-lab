name: Publish course reader

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages.yml'
      - 'scripts/**'
      - 'web/**'
      - 'notebooks/**'
      - 'reclab/**'
      - 'docs/*.json'
      - 'tests/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build the public reader
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Verify translated source parity
        run: python scripts/check_notebook_translations.py
      - name: Test the static export
        run: |
          python -m unittest discover -s tests -p 'test_pages.py'
          python -m unittest discover -s tests -p 'test_indexnow.py'
      - name: Build English and Chinese course pages
        env:
          INDEXNOW_KEY: ${{ secrets.PAGES_INDEXNOW_KEY }}
        run: python scripts/build_pages.py --output dist --site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
      - name: Upload public files only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
